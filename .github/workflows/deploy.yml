name: CD

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew clean bootJar -x test

      - name: Docker build
        run: docker build -t deasung-kiosk:latest .

      - name: Save Docker image
        run: docker save deasung-kiosk:latest | gzip > deasung-kiosk.tar.gz

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.NEW_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.NEW_EC2_SSH_KEY }}
          source: "deasung-kiosk.tar.gz,docker-compose.prod.yml"
          target: /home/${{ secrets.EC2_USER }}/projects/deasung-kiosk

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NEW_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.NEW_EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/projects/deasung-kiosk
            cat > .env.prod <<'ENVEOF'
            DB_URL=${{ secrets.DB_URL }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PORT=${{ secrets.REDIS_PORT }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ACCESS_EXPIRATION=${{ secrets.JWT_ACCESS_EXPIRATION }}
            JWT_REFRESH_EXPIRATION=${{ secrets.JWT_REFRESH_EXPIRATION }}
            S3_BUCKET=${{ secrets.S3_BUCKET }}
            AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}
            AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}
            ENVEOF
            docker load < deasung-kiosk.tar.gz
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d
            rm deasung-kiosk.tar.gz
            docker image prune -f
