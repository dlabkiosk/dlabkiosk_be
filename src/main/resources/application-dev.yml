spring:
  datasource:
    url: jdbc:mysql://localhost:3310/app?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: app
    password: app
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true

server:
  port: 8080
